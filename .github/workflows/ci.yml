name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install bash tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Tools preflight
        run: |
          scripts/testing/check-tools.sh

      - name: PHP lint and dev tests
        run: |
          scripts/testing/test-php.sh

      - name: Bash checks
        run: |
          scripts/testing/test-bash.sh

      - name: ADR doctrine lint
        run: |
          bash scripts/testing/doctrine-lint.sh

      - name: Sharp edges (advisory)
        run: |
          PMSS_LINT_SHARP_STRICT=0 bash scripts/testing/sharp-edges-lint.sh

      - name: Net edges (advisory)
        run: |
          PMSS_LINT_NET_STRICT=0 bash scripts/testing/net-edges-lint.sh

      - name: LOC snapshot
        run: |
          scripts/testing/loc.sh || true

  php73-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none

      - name: PHP 7.3 syntax check
        run: |
          scripts/testing/php-lint-compat.sh
