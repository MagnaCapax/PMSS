name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none

      - name: PHP 7.3 syntax lint
        run: |
          scripts/testing/php-lint-compat.sh | tee smoke-php-lint.log

      - name: PHP 7.3 static scan (no false positives)
        run: |
          scripts/testing/php73-compat-scan.sh | tee smoke-php-compat-scan.log

      - name: Upload smoke logs
        uses: actions/upload-artifact@v4
        with:
          name: smoke-php73-logs
          path: |
            smoke-php-lint.log
            smoke-php-compat-scan.log

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install bash tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Tools preflight
        run: |
          bash scripts/testing/check-tools.sh

      - name: PHP 7.3 compatibility scan (static)
        run: |
          bash scripts/testing/php73-compat-scan.sh

      - name: PHP lint and dev tests
        run: |
          scripts/testing/test-php.sh

      - name: Bash checks
        run: |
          scripts/testing/test-bash.sh

      - name: ADR doctrine lint
        run: |
          bash scripts/testing/doctrine-lint.sh

      - name: Docblock lint (required)
        run: |
          bash scripts/testing/docblock-lint.sh

      - name: Cgroup template lint
        run: |
          bash scripts/testing/cgroup-template-lint.sh

      - name: Sharp edges (advisory)
        run: |
          PMSS_LINT_SHARP_STRICT=0 bash scripts/testing/sharp-edges-lint.sh

      - name: Net edges (advisory)
        run: |
          PMSS_LINT_NET_STRICT=0 bash scripts/testing/net-edges-lint.sh

      - name: LOC snapshot
        run: |
          scripts/testing/loc.sh || true

      - name: PHPStan (advisory)
        run: |
          ALLOW_TOOL_SKIP=1 bash scripts/testing/phpstan.sh || true

  php73-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none

      - name: PHP 7.3 syntax check
        run: |
          scripts/testing/php-lint-compat.sh
