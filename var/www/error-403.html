<div class="container">
  <span class="error-message">403 - Forbidden</span>
  <br />
  <div class="content-container">
    <div id="image-container">
      <img alt="403 - Forbidden" id="error-image" />
    </div>

    <div class="error-description">
      <p>The sage guards this path. You do not have permission to access this resource.</p>
      <p>
        If you believe this is a mistake, return to the panel and try again with
        a valid account.
      </p>
      <p><a href="/">Return to the main page.</a></p>
    </div>
  </div>
</div>

<script>
  const variants = ['/404_images/404-1.png', '/404_images/404-2.png', '/404_images/404-3.png'];
  const imageElement = document.getElementById('error-image');
  imageElement.src = variants[Math.floor(Math.random() * variants.length)];
  imageElement.classList.add('error-image');
  imageElement.addEventListener('error', function () {
    imageElement.style.display = 'none';
  });

  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.type = 'text/css';
  link.href = '/css/error-styles.css';
  document.head.appendChild(link);
</script>
