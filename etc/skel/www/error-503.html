<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>503 - Service Unavailable</title>
  <style>
    body,
    html {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: black;
    }

    .container {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .content-container {
      border: 1px solid #fff;
      border-radius: 5px;
      max-width: 640px;
    }

    .error-message {
      color: #ff0080;
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 2rem;
      text-shadow: 0 0 10px #ff00ff;
    }

    .error-description {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      color: #fff;
      padding: 20px;
    }

    .error-description a {
      color: #6bb1ff;
    }

    .error-description a:hover {
      color: #9fd0ff;
    }
  </style>
</head>
<body>
<div class="container">
  <span class="error-message">503 - Service Unavailable</span>
  <br />
  <div class="content-container">
    <div class="error-description">
      <p>The sage is waiting for this application to answer.</p>
      <p>The service is enabled, but its backend is still starting or restarting.</p>
      <p>This page checks the same address automatically and reloads when it is ready.</p>
      <p><a href="/">Return to the main page.</a></p>
    </div>
  </div>
</div>

<script>
(function () {
  var pollDelayMs = 5000;
  var directErrorPage = /\/error-503\.html(?:$|\?)/.test(window.location.pathname + window.location.search);
  var reloading = false;
  var inFlight = false;

  function retryUrl() {
    var href = window.location.href.split('#')[0];
    var separator = href.indexOf('?') === -1 ? '?' : '&';
    return href + separator + 'pmss503check=' + Date.now();
  }

  function schedule() {
    window.setTimeout(checkBackend, pollDelayMs);
  }

  function checkBackend() {
    if (reloading || inFlight) {
      return;
    }
    if (typeof window.fetch !== 'function') {
      window.location.reload();
      return;
    }

    inFlight = true;
    window.fetch(retryUrl(), {
      cache: 'no-store',
      credentials: 'same-origin',
      method: 'GET'
    }).then(function (response) {
      inFlight = false;
      if (response.status < 500) {
        reloading = true;
        window.location.reload();
        return;
      }
      schedule();
    }).catch(function () {
      inFlight = false;
      schedule();
    });
  }

  if (!directErrorPage) {
    schedule();
  }
}());
</script>
</body>
</html>
