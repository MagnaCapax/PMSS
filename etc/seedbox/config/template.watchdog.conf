# PMSS watchdog configuration (robust defaults)
# Policy: ADR 0301. The daemon reboots a host only for a stuck /home write path
# (/etc/watchdog.d/home-write-check.sh), sustained network loss (network-check.sh)
# or a dead hardware heartbeat. Load average is no reboot signal: it counts threads
# blocked on I/O, so a busy host that is still completing work looks like a dead one.
watchdog-device = /dev/watchdog
watchdog-timeout = 60
interval = 10
logtick = 30

# Lock the daemon into RAM and run it at real-time priority (default priority 1), so
# memory pressure cannot page it out and starve the hardware heartbeat into a reset.
realtime = yes

# Avoid built-in ping checks (false positives on WAN)
# ping = <disabled>

# Errors must persist before watchdog acts
retry-timeout = 3600

# Minimal memory check (1 page) to avoid false positives
min-memory = 1

# Custom test scripts
test-directory = /etc/watchdog.d
