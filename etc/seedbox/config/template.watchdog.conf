# PMSS watchdog configuration (robust defaults)
watchdog-device = /dev/watchdog
watchdog-timeout = 60
interval = 10
logtick = 30

# Avoid built-in ping checks (false positives on WAN)
# ping = <disabled>

# Errors must persist before watchdog acts
retry-timeout = 3600

# Seedboxes run hot; keep the load threshold high
max-load-1 = 300

# Minimal memory check (1 page) to avoid false positives
min-memory = 1

# Custom test scripts
test-directory = /etc/watchdog.d
