# PMSS watchdog configuration (robust defaults)
watchdog-device = /dev/watchdog
watchdog-timeout = 60
interval = 10
logtick = 30

# Avoid built-in ping checks (false positives on WAN)
# ping = <disabled>

# Errors must persist before watchdog acts
retry-timeout = 3600

# Seedboxes run hot; keep the load thresholds high. All three windows are set
# explicitly: watchdog otherwise DERIVES max-load-5 and max-load-15 from
# max-load-1 (3/4 and 1/2), which silently lowers them to 225 and 150 and
# reboots earlier than the seedbox profile intends.
max-load-1 = 300
max-load-5 = 300
max-load-15 = 300

# Minimal memory check (1 page) to avoid false positives
min-memory = 1

# Custom test scripts
test-directory = /etc/watchdog.d
