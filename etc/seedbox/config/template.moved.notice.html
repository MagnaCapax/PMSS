<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your service has moved - Pulsed Media</title>
  <link rel="stylesheet" href="/css/error-styles.css" />
  <style>
    html { background:#030711; }
    body { background:#030711; height:auto; min-height:100%; color:#f5f5f5; font-family: "Inter", "Segoe UI", sans-serif; }
    .container { max-width:860px; min-height:0; margin:6vh auto; padding:0 2rem; }
    h1 { font-size:2.8rem; font-weight:600; margin-bottom:1.25rem; }
    .content-container { background:rgba(12,18,30,0.92); padding:2.5rem; border:0; border-radius:18px; box-shadow:0 30px 90px rgba(0,0,0,0.45); }
    .error-description { font-size:1.05rem; line-height:1.7; padding:0; background:transparent; box-shadow:none; }
    .error-description a.cta, .error-description a.cta:visited { margin-top:1.5rem; display:inline-block; padding:.75rem 1.5rem; border-radius:999px; background:#3478f6; color:#fff; text-decoration:none; font-weight:600; }
    .error-description a.cta:hover, .error-description a.cta:focus { background:#2a63c8; color:#fff; }
  </style>
</head>
<body>
  <main class="container">
    <p>Pulsed Media</p>
    <h1>Your service has moved</h1>
    <div class="content-container">
      <div class="error-description">
        <p>Your service now runs on a new server. Log in to the client area to find your new server details.</p>
        <p>This old copy stays reachable over SFTP/SSH until ##movedUntil, so you can still fetch anything left behind. After that it is removed.</p>
        <a class="cta" href="https://pulsedmedia.com/clients/clientarea.php">Log in to the client area</a>
      </div>
    </div>
  </main>
</body>
</html>
