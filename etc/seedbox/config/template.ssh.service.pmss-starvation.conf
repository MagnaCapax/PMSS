[Service]
# PMSS defense-in-depth: per-user slice containment prevents pid exhaustion.
# Keep sshd favored for CPU/IO/OOM pressure so root can still recover hosts.
# OpenSSH oom_adjust_setup protects the listener; OOMScoreAdjust here would leak -1000 into every session.
CPUWeight=10000
IOWeight=10000
MemoryMin=64M
