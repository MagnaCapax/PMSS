## PMSS rsyslog remote forwarding (managed by PMSS update)
##
## This configuration enables forwarding of local logs to a central log server.
## DISABLED by default; only deployed when /etc/seedbox/config/logging.conf
## exists and sets remote_logging_enabled=1.
##
## Placeholders replaced at deployment:
##   %%PMSS_RSYSLOG_REMOTE_HOST%%  - Remote syslog server hostname/IP
##   %%PMSS_RSYSLOG_REMOTE_PORT%%  - Remote syslog server port (default: 514)
##   %%PMSS_RSYSLOG_PROTOCOL%%     - Protocol: tcp or udp (default: tcp)
##
## This file uses the imjournal module to read systemd journal entries,
## ensuring compatibility with modern systemd-based logging infrastructure.

# Load the imjournal module to read from systemd journal
module(load="imjournal"
       StateFile="imjournal.state"
       IgnorePreviousMessages="on"
       PersistStateInterval="100")

# Forward all logs to remote server
# Using @@host for TCP, @host for UDP
*.* action(type="omfwd"
           target="%%PMSS_RSYSLOG_REMOTE_HOST%%"
           port="%%PMSS_RSYSLOG_REMOTE_PORT%%"
           protocol="%%PMSS_RSYSLOG_PROTOCOL%%"
           queue.type="LinkedList"
           queue.filename="pmss_remote_queue"
           queue.maxdiskspace="100m"
           queue.saveonshutdown="on"
           action.resumeRetryCount="-1"
           action.resumeInterval="30")
