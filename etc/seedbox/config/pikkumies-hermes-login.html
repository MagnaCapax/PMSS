<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Hermes</title>
<style>:root{color-scheme:dark}body{margin:0;padding:16px;background:#0f1720;color:#e6edf3;font:14px system-ui}main{max-width:480px;margin:10vh auto;padding:24px;border:1px solid #2e3b4f;border-radius:12px}h1{font-size:18px}a{color:#93c5fd}</style></head>
<body><main><h1>Signing you in to Hermes.</h1><noscript><p><a href="/login">Sign in</a></p></noscript></main>
<script>(function(){var m=/^#token=([0-9a-f]{64})$/.exec(location.hash);history.replaceState(null,'',location.pathname);if(!m){location.replace('/');return;}if(typeof fetch!=='function'){location.replace('/login');return;}fetch('/__pmss-session',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'text/plain'},body:m[1]}).then(function(r){location.replace(r.status===204?'/':'/login');},function(){location.replace('/login');});})();</script></body></html>
